apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.metadata.labels.app }}-configmap
data:
  RETAIL_CART_PERSISTENCE_PROVIDER: dynamodb
  RETAIL_CART_PERSISTENCE_DYNAMODB_TABLE_NAME: Items
  RETAIL_CART_PERSISTENCE_DYNAMODB_CREATE_TABLE: "true"
  AWS_ACCESS_KEY_ID:
  AWS_SECRET_ACCESS_KEY: 
  RETAIL_CART_PERSISTENCE_DYNAMODB_ENDPOINT: http://{{ .Values.metadata.labels.app }}-dynamodb-service:8000